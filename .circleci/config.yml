version: 2.1
jobs:
  build:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout
      - run:
          name: install pixi
          command: |
            curl -fsSL https://pixi.sh/install.sh | bash
            echo 'export PATH="$HOME/.pixi/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: run tests
          command: |
            set -e
            source "$BASH_ENV"
            pixi run test