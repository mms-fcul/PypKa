version: 2.1

jobs:
  build:
    parameters:
      python_env:
        type: string
    docker:
      - image: cimg/base:stable

    steps:
      - checkout
      - run:
          name: install pixi
          command: |
            curl -fsSL https://pixi.sh/install.sh | bash
            echo 'export PATH="$HOME/.pixi/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: run tests on << parameters.python_env >>
          command: |
            set -e
            source "$BASH_ENV"
            pixi run -e << parameters.python_env >> test

workflows:
  test-all-supported-pythons:
    jobs:
      - build:
          matrix:
            parameters:
              python_env: ["py39", "py310", "py311", "py312", "py313", "py314"]
