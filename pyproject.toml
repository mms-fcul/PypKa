[project]
name = "pypka"
version = "3.0.0a1"
description = "A python module for flexible Poisson-Boltzmann based pKa calculations with proton tautomerism"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9,<3.15"
license = { text = "LGPL-3.0-only" }
authors = [
  { name = "Pedro Reis", email = "pdreis@fc.ul.pt" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
dependencies = [
  "psutil",
  "delphi4py==1.6.1",
  "pdbmender==0.6.1",
  "numpy>=2,<3"
]

[project.urls]
Homepage = "https://pypka.org"
Repository = "https://github.com/mms-fcul/PypKa"
Documentation = "https://pypka.readthedocs.io/en/latest/"

[project.scripts]
pypka = "pypka.cli:CLI"

[build-system]
requires = ["setuptools>=69", "wheel", "Cython>=3.0.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pypka*"]

[tool.setuptools.package-data]
pypka = ["**/*"]

[tool.setuptools.exclude-package-data]
pypka = [
  "**/__pycache__/*",
  "*.py[cod]",
  "**/*.py[cod]",
  "*.so",
  "**/*.so",
  "*.o",
  "**/*.o",
  "build/*",
  "**/build/*",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.feature.runtime.dependencies]
numpy = ">=2,<3"

[tool.pixi.feature.runtime.pypi-dependencies]
pypka = { path = ".", editable = true }

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.dev.dependencies]
c-compiler = "*"

[tool.pixi.feature.dev.pypi-dependencies]
cython = ">=3.0.11"
black = "*"
bump2version = "*"
build = "*"
coverage = "*"
flake8 = "*"
isort = "*"
mypy = "*"
pytest = ">=6.2.5"
pytest-cov = "*"
setuptools = "*"
tox = "*"
twine = "*"

[tool.pixi.feature.docs.pypi-dependencies]
recommonmark = "*"
sphinx = "*"
sphinx-rtd-theme = "*"

[tool.pixi.environments]
default = { features = ["runtime", "py312", "dev", "docs"] }
py39 = { features = ["runtime", "py39", "dev"] }
py310 = { features = ["runtime", "py310", "dev"] }
py311 = { features = ["runtime", "py311", "dev"] }
py312 = { features = ["runtime", "py312", "dev"] }
py313 = { features = ["runtime", "py313", "dev"] }
py314 = { features = ["runtime", "py314", "dev"] }

[tool.pixi.tasks]
build = "python -m build"
compile-mc = "python setup.py build_ext --inplace"
coverage = "cd tests && coverage run -m pytest test.py && coverage report -m --include='/*/pypka/pypka/*' && coverage html --include='*/pypka/pypka/*' -d html_coverage"
docs = "rm -f docs/pypka.rst docs/modules.rst && sphinx-apidoc -o docs/ pypka && make -C docs clean html"
format = "isort *.py pypka/clean/*.py && black pypka"
lint = "mypy && flake8"
publish = "python -m twine upload dist/*"
test = "cd tests && pytest test.py"
test_fast = "cd tests && pytest test.py -k 'ktp'"

[tool.pixi.tasks.bump]
cmd = "bump2version {{ part }}"
args = [{ arg = "part", default = "patch" }]
description = "Bump the PypKa version (part: major | minor | patch), committing and tagging the change"

[tool.pixi.tasks.bump-patch]
depends-on = [{ task = "bump", args = ["patch"] }]
description = "Bump the PypKa patch version"

[tool.pixi.tasks.bump-minor]
depends-on = [{ task = "bump", args = ["minor"] }]
description = "Bump the PypKa minor version"

[tool.pixi.tasks.bump-major]
depends-on = [{ task = "bump", args = ["major"] }]
description = "Bump the PypKa major version"

[tool.pixi.tasks.bump-to]
cmd = "bump2version --new-version {{ version }} patch"
args = ["version"]
description = "Set an explicit version, e.g. `pixi run bump-to 3.0.0a1` to start a pre-release series"

[tool.pixi.tasks.bump-build]
cmd = "bump2version build"
description = "Increment the pre-release build number (3.0.0a1 -> 3.0.0a2)"

[tool.pixi.tasks.bump-release]
cmd = "bump2version release"
description = "Advance the pre-release stage (a -> b -> rc -> final, e.g. 3.0.0rc0 -> 3.0.0)"
